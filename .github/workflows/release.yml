name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build exe
        shell: pwsh
        run: .\build_exe.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $asset = Get-ChildItem .\dist -Filter '*.exe' | Select-Object -First 1
          if (-not $asset) {
            throw "No exe asset was produced."
          }
          $uploadAsset = Join-Path $asset.DirectoryName "RecruitTool.exe"
          Copy-Item -LiteralPath $asset.FullName -Destination $uploadAsset -Force
          if (gh release view $env:TAG_NAME *> $null) {
            gh release upload $env:TAG_NAME $uploadAsset --clobber
          } else {
            gh release create $env:TAG_NAME $uploadAsset --title $env:TAG_NAME --notes "自动构建版本 $env:TAG_NAME"
          }
