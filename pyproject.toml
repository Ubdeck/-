[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruit-assistant-desktop"
version = "0.1.0"
description = "招聘工具 desktop automation for recruiting workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "DrissionPage>=4.1.1",
  "psutil>=5.9",
  "DataRecorder>=3.6.2",
  "DownloadKit>=2.0.7",
  "pywebview>=6.2.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
]

[project.scripts]
recruit-assistant = "recruit_assistant.desktop_app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recruit_assistant = ["web/*.html", "web/*.css", "web/*.js"]
